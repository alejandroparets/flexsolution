kind = "video"
previewPath = "/tiktok-video/"
title = "TikTok FlexSolution"
version = "1.0.0"
id = "artifacts/tiktok-video"
router = "path"

[[integratedSkills]]
name = "video-js"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/tiktok-video/" ]
localPort = 24646

[services.development]
run = "pnpm --filter @workspace/tiktok-video run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/tiktok-video", "run", "build" ]
publicDir = "artifacts/tiktok-video/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "24646"
BASE_PATH = "/tiktok-video/"
